name: whatsapp-caillaux
services:
  worker:
    image: ${WHATSAPP_IMAGE:?Configura una imagen verificada por SHA}
    user: "999:988"
    read_only: true
    restart: "no"
    init: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 768
    shm_size: 512m
    stop_grace_period: 120s
    environment:
      WHATSAPP_DATA_UUID: ${WHATSAPP_DATA_UUID:?Falta UUID del disco}
      WHATSAPP_CLIENT_FINGERPRINTS: ${WHATSAPP_CLIENT_FINGERPRINTS:?Falta huella cliente}
      WHATSAPP_MAX_SESSIONS: ${WHATSAPP_MAX_SESSIONS:-3}
      WHATSAPP_REQUIRE_CAMPAIGN_LEASES: ${WHATSAPP_REQUIRE_CAMPAIGN_LEASES:-false}
    ports:
      - "10.0.2.68:8443:8443"
    volumes:
      - type: bind
        source: /srv/whatsapp-data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /etc/whatsapp-worker/tls
        target: /tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/whatsapp-worker
        target: /run/crm-control
        bind:
          create_host_path: false
      - type: bind
        source: /run/whatsapp-lock/worker.lock
        target: /run/crm-lock/worker.lock
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  backup:
    profiles: [maintenance]
    image: ${WHATSAPP_IMAGE:?Configura una imagen verificada por SHA}
    command: [backup]
    user: "999:988"
    read_only: true
    restart: "no"
    init: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    pids_limit: 64
    environment:
      WHATSAPP_DATA_UUID: ${WHATSAPP_DATA_UUID:?Falta UUID del disco}
      WHATSAPP_BACKUP_DIRECTORY: /backup
    volumes:
      - type: bind
        source: /srv/whatsapp-data
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/whatsapp-data/profile-backups
        target: /backup
        bind:
          create_host_path: false
      - type: bind
        source: /etc/whatsapp-worker/recovery-public/public.pem
        target: /recovery/public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/whatsapp-lock/worker.lock
        target: /run/crm-lock/worker.lock
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
