name: Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Requerido para el inicio de sesión federado con Azure

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compilar imagen del worker WhatsApp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/whatsapp-vm/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: whatsapp-caillaux:ci
          cache-from: type=gha,scope=whatsapp-worker
          cache-to: type=gha,mode=max,scope=whatsapp-worker

      - name: Comprobar la imagen del worker WhatsApp
        run: |
          docker run --rm --entrypoint sh whatsapp-caillaux:ci -ec '
            test -f /app/worker.mjs
            test -f /app/maintenance.mjs
            test -x /app/entrypoint.sh
            node --check /app/worker.mjs
          '

      - name: Compilar la imagen de producción
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: gestion-oficina:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar las herramientas incluidas
        run: |
          docker run --rm --entrypoint sh gestion-oficina:ci -ec '
            test "$(id -u)" != 0
            test -f /app/server.js
            test -d /app/.next/static
            test -f /app/node_modules/playwright/package.json
            command -v Xvfb
            pg_dump --version
          '

      # Desde main se publica en ACR la imagen verificada; los pull requests y otras ramas solo ejecutan las comprobaciones.
      - name: Iniciar sesión en Azure con OIDC
        if: >-
          github.repository == 'alejandro-javier-ds/gestion-oficina' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # AcrPush concede acceso a imágenes, sin permisos para administrar el registro.
      # Intercambiamos el token de Entra por uno de ACR sin utilizar az acr login.
      - name: Autenticar Docker en Azure Container Registry
        if: >-
          github.repository == 'alejandro-javier-ds/gestion-oficina' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          ACR_LOGIN_SERVER: acrgestionescaillaux-hwg9a5hvg7f6bxeu.azurecr.io
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          AAD_ACCESS_TOKEN="$(az account get-access-token --resource https://containerregistry.azure.net --query accessToken -o tsv)"
          ACR_REFRESH_TOKEN="$(
            curl --fail --silent --show-error \
              --request POST \
              --url "https://${ACR_LOGIN_SERVER}/oauth2/exchange" \
              --data-urlencode "grant_type=access_token" \
              --data-urlencode "service=${ACR_LOGIN_SERVER}" \
              --data-urlencode "tenant=${AZURE_TENANT_ID}" \
              --data-urlencode "access_token=${AAD_ACCESS_TOKEN}" |
            jq -er '.refresh_token'
          )"
          echo "::add-mask::$ACR_REFRESH_TOKEN"
          printf "%s" "$ACR_REFRESH_TOKEN" | docker login "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin
          unset AAD_ACCESS_TOKEN ACR_REFRESH_TOKEN

      - name: Publicar imagen verificada en ACR
        if: >-
          github.repository == 'alejandro-javier-ds/gestion-oficina' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          ACR_LOGIN_SERVER: acrgestionescaillaux-hwg9a5hvg7f6bxeu.azurecr.io
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/gestion-oficina"
          docker tag gestion-oficina:ci "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker tag gestion-oficina:ci "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
