name: Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compilar la imagen de producción
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: gestion-oficina:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar las herramientas incluidas
        run: |
          docker run --rm --entrypoint sh gestion-oficina:ci -ec '
            test "$(id -u)" != 0
            test -f /app/server.js
            test -d /app/.next/static
            test -f /app/node_modules/playwright/package.json
            command -v Xvfb
            pg_dump --version
          '
